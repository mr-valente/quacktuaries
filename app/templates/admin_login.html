{% extends "base.html" %}
{% block title %}Teacher Login — Quacktuaries{% endblock %}

{% block content %}
<div style="max-width:400px; margin:0 auto;">
  <div class="card">
    <h2>👩‍🏫 Teacher Setup</h2>
    <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:1rem;">
      Continue to your teacher dashboard.
    </p>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="{{ request.url_for('admin_login') }}">
      <div class="form-group">
        <label for="teacher_name">Your Name</label>
        <input type="text" id="teacher_name" name="teacher_name" class="form-control"
               {% if request.state.ecosystem_account and request.state.ecosystem_account.kind == 'google' %}value="{{ request.state.ecosystem_account.name }}" readonly{% endif %}
               placeholder="e.g. Professor Duck" maxlength="60" required>
      </div>
      <button type="submit" class="btn btn-warning" style="width:100%;">Continue as Teacher</button>
    </form>
  </div>
</div>
{% endblock %}
